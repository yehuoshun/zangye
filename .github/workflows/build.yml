name: Build ZangYe

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go mod download
        run: go mod download
        working-directory: .

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        run: |
          mkdir -p dist && echo '<html><body><h1>ZangYe</h1><p>Static build placeholder</p></body></html>' > dist/index.html
        working-directory: frontend

      - name: Build Go binary (Windows amd64)
        run: |
          mkdir -p frontend/dist
          GOOS=windows GOARCH=amd64 go build -v -o zangye.exe -ldflags="-s -w" . 2>&1 | tee /tmp/go-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "=== GO BUILD FAILED ==="
            head -100 /tmp/go-build.log
            echo ""
            echo "=== Contents of frontend/dist ==="
            ls -la frontend/dist/ 2>&1
            echo ""
            echo "=== go.mod ==="
            cat go.mod
            echo ""
            echo "=== go.sum head ==="
            head -20 go.sum
            exit 1
          fi
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zangye-windows-amd64
          path: zangye.exe
