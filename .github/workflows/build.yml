name: Build ZangYe

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go mod download
        run: go mod download
        working-directory: .

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        run: |
          mkdir -p dist && echo '<html><body><h1>ZangYe</h1><p>Static build placeholder</p></body></html>' > dist/index.html
        working-directory: frontend

      - name: Build Go binary (Windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -o zangye.exe -ldflags="-s -w" .
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zangye-windows-amd64
          path: zangye.exe
