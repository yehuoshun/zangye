name: Build ZangYe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go mod tidy
        run: go mod tidy
        working-directory: .

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        run: |
          npm install 2>&1
          npm run build 2>&1
        working-directory: frontend

      - name: Build Go binary (Windows amd64)
        run: |
          mkdir -p frontend/dist
          GOOS=windows GOARCH=amd64 go build -v -o zangye.exe -ldflags="-s -w" .
        working-directory: .

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: zangye.exe
