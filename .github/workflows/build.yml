name: Build ZangYe

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go mod tidy
        run: go mod tidy
        working-directory: .

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        run: |
          npm ci 2>&1
          npm run build 2>&1
          echo ""
          echo "=== dist contents ==="
          ls -la dist/
        working-directory: frontend

      - name: Build Go binary (Windows amd64)
        run: |
          mkdir -p frontend/dist
          GOOS=windows GOARCH=amd64 go build -v -o zangye.exe -ldflags="-s -w" .
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zangye-windows-amd64
          path: zangye.exe
